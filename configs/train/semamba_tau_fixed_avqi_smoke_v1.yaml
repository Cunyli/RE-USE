# Smoke test for RE-USE/SEMamba AVQI W&B logging.
# This is only intended to verify val_avqi/* metrics wiring.

repo_name: reuse
model_name: semamba
experiment: tau_fixed_avqi_smoke_v1
wandb_change: avqi_smoke_v1

env_setting:
  num_gpus: 1
  num_workers: 0
  seed: 20260513
  stdout_interval: 1
  checkpoint_interval_steps: 1000
  checkpoint_keep: 1
  validation_interval_steps: 1000
  wandb_log_interval_steps: 1
  avqi_validation_interval_steps: 1
  dist_cfg:
    dist_backend: nccl
    dist_url: tcp://localhost:19491
    world_size: 1

data_cfg:
  dataset_type: use_simulation_fixed
  use_simulation_root: ${USE_SIMULATION_ROOT:-../USE_simulation}
  train_pair_manifest: ${REUSE_TAU_FIXED_TRAIN_CSV:-/path/to/tau/simulated/phone_room/train/paired.csv}
  valid_pair_manifest: ${REUSE_TAU_FIXED_VALID_CSV:-/path/to/tau/simulated/phone_room/valid/paired.csv}

wandb_cfg:
  use_wandb: true
  project: reuse
  entity: null
  mode: online
  run_name: null
  group: null
  run_id: null
  resume: allow
  tags: ["tau", "use_simulation", "fixed", "avqi_smoke_v1"]

training_cfg:
  training_epochs: 1
  batch_size: 4
  gradient_accumulation_steps: 1
  use_metric_loss: false
  learning_rate: 0.0005
  adam_b1: 0.8
  adam_b2: 0.99
  lr_decay: 0.99
  segment_size: 8000
  loss:
    metric: 0.0
    magnitude: 0.9
    phase: 0.3
    complex: 0.1
    time: 0.2
    consistancy: 0.1
  use_PCS400: False

stft_cfg:
  sampling_rate: 16000
  n_fft: 400
  hop_size: 100
  win_size: 400

model_cfg:
  hid_feature: 64
  compress_factor: 0.3
  num_tfmamba: 4
  d_state: 16
  d_conv: 4
  expand: 4
  norm_epsilon: 0.00001
  beta: 2.0
  input_channel: 2
  output_channel: 1
